<div class="min-h-screen bg-almond flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-black text-blue-black uppercase tracking-tight">
      Reset your password
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Or
      <a routerLink="/login" class="font-medium text-salmon hover:text-blue-black transition-colors">
        return to login
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-100">
      
      
      <form *ngIf="step === 1" [formGroup]="otpFormGroup" (ngSubmit)="requestOtp()" class="space-y-6">
        <div *ngIf="errorMsg" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
          <p class="text-sm text-red-700">{{ errorMsg }}</p>
        </div>

        <div>
          <label for="mobile" class="block text-sm font-medium text-blue-black">Mobile Number</label>
          <div class="mt-1">
            <input id="mobile" type="text" formControlName="mobile"
              [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500 bg-red-50': otpFormGroup.get('mobile')?.invalid && otpFormGroup.get('mobile')?.touched,
                         'border-gray-300 focus:ring-salmon focus:border-salmon': !(otpFormGroup.get('mobile')?.invalid && otpFormGroup.get('mobile')?.touched)}"
              class="appearance-none block w-full px-3 py-2 border rounded-md shadow-sm placeholder-gray-400 focus:outline-none sm:text-sm transition-colors">
          </div>
          <div *ngIf="otpFormGroup.get('mobile')?.invalid && otpFormGroup.get('mobile')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="otpFormGroup.get('mobile')?.hasError('required')">Mobile number is required.</span>
            <span *ngIf="otpFormGroup.get('mobile')?.hasError('pattern')">Please enter a valid Egyptian mobile number.</span>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="otpFormGroup.invalid || isLoading"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-black hover:bg-salmon focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-salmon uppercase tracking-wide transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <i *ngIf="isLoading" class="pi pi-spin pi-spinner mr-2"></i>
            {{ isLoading ? 'Sending...' : 'Send Verification Code' }}
          </button>
        </div>
      </form>

      
      <form *ngIf="step === 2" [formGroup]="resetFormGroup" (ngSubmit)="resetPassword()" class="space-y-6">
        <div *ngIf="errorMsg" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
          <p class="text-sm text-red-700">{{ errorMsg }}</p>
        </div>

        <div>
          <label for="otp" class="block text-sm font-medium text-blue-black">Verification Code (Mock)</label>
          <div class="mt-1">
            <input id="otp" type="text" formControlName="otp"
              placeholder="Enter any code for now"
              [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500 bg-red-50': resetFormGroup.get('otp')?.invalid && resetFormGroup.get('otp')?.touched}"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-salmon focus:border-salmon sm:text-sm">
          </div>
          <div *ngIf="resetFormGroup.get('otp')?.hasError('required') && resetFormGroup.get('otp')?.touched" class="mt-1 text-sm text-red-600">
            Verification code is required.
          </div>
        </div>

        <div>
          <label for="newPassword" class="block text-sm font-medium text-blue-black">New Password</label>
          <div class="mt-1">
            <input id="newPassword" type="password" formControlName="newPassword"
              [ngClass]="{'border-red-300 focus:ring-red-500 focus:border-red-500 bg-red-50': resetFormGroup.get('newPassword')?.invalid && resetFormGroup.get('newPassword')?.touched}"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-salmon focus:border-salmon sm:text-sm">
          </div>
          <div *ngIf="resetFormGroup.get('newPassword')?.invalid && resetFormGroup.get('newPassword')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="resetFormGroup.get('newPassword')?.hasError('required')">Password is required.</span>
            <span *ngIf="resetFormGroup.get('newPassword')?.hasError('minlength')">Password must be at least 8 characters.</span>
          </div>
        </div>

        <div class="flex gap-4">
          <button type="button" (click)="step = 1; errorMsg = ''"
            class="w-1/3 flex justify-center py-2.5 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-bold text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-salmon uppercase tracking-wide transition-colors">
            Back
          </button>
          <button type="submit" [disabled]="resetFormGroup.invalid || isLoading"
            class="w-2/3 flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-black hover:bg-salmon focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-salmon uppercase tracking-wide transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <i *ngIf="isLoading" class="pi pi-spin pi-spinner mr-2"></i>
            {{ isLoading ? 'Resetting...' : 'Reset Password' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
