<div class="bg-white border border-gray-100 p-6">
  <h2 class="text-2xl font-black text-blue-black uppercase mb-6 border-b pb-4">My Profile</h2>

  <div *ngIf="isLoading" class="flex justify-center py-12">
    <i class="pi pi-spin pi-spinner text-3xl text-salmon"></i>
  </div>

  <div *ngIf="!isLoading">
    
    <div *ngIf="successMsg" class="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 text-sm font-semibold">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm font-semibold">{{ errorMsg }}</div>

    
    <form (ngSubmit)="saveProfile()" class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Full Name</label>
        <input pInputText [(ngModel)]="name" name="name" placeholder="Your name"
          class="border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none">
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Email</label>
        <input pInputText [(ngModel)]="email" name="email" type="email" placeholder="your@email.com"
          class="border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none">
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Mobile Number</label>
        <input pInputText [(ngModel)]="phoneNumber" name="phoneNumber" placeholder="01xxxxxxxxx"
          class="border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none">
      </div>
      <div class="flex items-end">
        <button type="submit" [disabled]="isSaving"
          class="w-full bg-blue-black text-white py-3 text-sm font-bold uppercase hover:bg-salmon transition-colors disabled:opacity-50">
          {{ isSaving ? 'Saving…' : 'Save Changes' }}
        </button>
      </div>
    </form>

    
    <div class="border-t pt-6">
      <button (click)="showPasswordForm = !showPasswordForm"
        class="flex items-center gap-2 text-sm font-bold text-blue-black hover:text-salmon transition-colors uppercase tracking-wide mb-4">
        <i class="pi pi-lock"></i>
        {{ showPasswordForm ? 'Cancel' : 'Change Password' }}
      </button>

      <form *ngIf="showPasswordForm" (ngSubmit)="changePassword()" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Current Password</label>
          <input pInputText [(ngModel)]="currentPassword" name="currentPassword" type="password"
            class="border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">New Password</label>
          <input pInputText [(ngModel)]="newPassword" name="newPassword" type="password"
            class="border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Confirm Password</label>
          <input pInputText [(ngModel)]="passwordConfirm" name="passwordConfirm" type="password"
            class="border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none">
        </div>
        <div class="md:col-span-3">
          <button type="submit" [disabled]="isSaving"
            class="bg-blue-black text-white px-8 py-3 text-sm font-bold uppercase hover:bg-salmon transition-colors disabled:opacity-50">
            {{ isSaving ? 'Updating…' : 'Update Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
