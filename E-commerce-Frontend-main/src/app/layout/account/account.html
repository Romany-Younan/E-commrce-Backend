<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 py-10">
    <div class="flex flex-col md:flex-row gap-6">

      
      <aside class="md:w-64 flex-shrink-0">
        <div class="bg-white border border-gray-100 p-6">
          <div class="border-b pb-4 mb-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1">Signed in as</p>
            <p class="text-blue-black font-black text-lg uppercase">{{ userName }}</p>
          </div>
          <nav class="flex flex-col gap-1">
            <a routerLink="profile" routerLinkActive="bg-almond text-salmon font-bold"
              class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 hover:bg-almond hover:text-salmon transition-colors">
              <i class="pi pi-user w-4"></i> My Profile
            </a>
            <a routerLink="orders" routerLinkActive="bg-almond text-salmon font-bold"
              class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 hover:bg-almond hover:text-salmon transition-colors">
              <i class="pi pi-box w-4"></i> My Orders
            </a>
            <a routerLink="addresses" routerLinkActive="bg-almond text-salmon font-bold"
              class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 hover:bg-almond hover:text-salmon transition-colors">
              <i class="pi pi-map-marker w-4"></i> My Addresses
            </a>
            <a routerLink="testimonial" routerLinkActive="bg-almond text-salmon font-bold"
              class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 hover:bg-almond hover:text-salmon transition-colors">
              <i class="pi pi-star w-4"></i> My Review
            </a>
            <hr class="my-2 border-gray-100">
            <button (click)="logout()"
              class="flex items-center gap-3 px-3 py-2.5 text-sm text-red-400 hover:bg-red-50 hover:text-red-600 transition-colors w-full text-left">
              <i class="pi pi-sign-out w-4"></i> Sign Out
            </button>
          </nav>
        </div>
      </aside>

      
      <main class="flex-1 min-w-0">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>
</div>
