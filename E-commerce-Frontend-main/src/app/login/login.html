<div class="min-h-screen flex items-center justify-center bg-almond">
  <div class="bg-white p-10 md:w-[420px] w-full shadow-lg">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black text-blue-black uppercase">Welcome Back</h2>
      <p class="text-gray-400 text-sm mt-1">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Mobile Number</label>
        <input pInputText type="tel" formControlName="mobile"
          placeholder="01xxxxxxxxx"
          [ngClass]="{'border-red-400 focus:border-red-400 bg-red-50': loginForm.get('mobile')?.invalid && loginForm.get('mobile')?.touched}"
          class="w-full border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none transition-colors rounded-none"
          >
        <p *ngIf="loginForm.get('mobile')?.hasError('required') && loginForm.get('mobile')?.touched" class="text-red-500 text-xs mt-0.5">Mobile number is required.</p>
        <p *ngIf="loginForm.get('mobile')?.hasError('pattern') && loginForm.get('mobile')?.touched" class="text-red-500 text-xs mt-0.5">Enter a valid Egyptian mobile (01xxxxxxxxx).</p>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Password</label>
        <input pInputText type="password" formControlName="password"
          placeholder="Enter your password"
          [ngClass]="{'border-red-400 focus:border-red-400 bg-red-50': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
          class="w-full border border-gray-200 px-4 py-3 text-sm focus:border-salmon focus:outline-none transition-colors rounded-none"
          >
        <p *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-0.5">Password is required.</p>
        <div class="flex justify-end mt-1">
          <a routerLink="/forgot-password" class="text-xs text-gray-500 hover:text-salmon transition-colors">Forgot Password?</a>
        </div>
      </div>

      
      <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3">
        {{ errorMsg }}
      </div>

      <button pButton type="submit" label="Sign In"
        class="w-full bg-blue-black border-none text-white hover:bg-salmon transition-colors py-3 uppercase font-bold tracking-widest mt-1"
        [loading]="isLoading">
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-500">
      Don't have an account?
      <a routerLink="/signup" class="text-salmon font-semibold hover:underline ml-1">Sign Up</a>
    </div>
  </div>
</div>
